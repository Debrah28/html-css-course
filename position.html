<!DOCTYPE html>
<html>
  <head>
    <title>Position Practice</title>
  </head>
  <body style="
  height: 300px;
  padding-top: 60px;
  padding-left: 80px;">

  <!--we have padding, here because, since our position is fixed and we have set a height, the first div might be covered by the height we have set.-->
    <div style="
      background-color: black;
      color: white;
      position: fixed;
      right: 0;
      left: 0;
      top: 0;
      height: 50px;
      z-index: 20;
      ">Header</div>
      
      <div style="
      background-color: green;
      color: white;
      position: fixed;

      left: 0;
      bottom: 0;
      top: 50px;
      width: 72px;">
        sidebar

         <div style="
        position: absolute;
        background-color: red;
        color: white;
        top: 0;
        right: 0;
        ">
        X
      </div>

          <div style="
        position: absolute;
        background-color: red;
        color: white;
        top: 60px;
        right: 10px;
        ">
        absolute
      </div>
      </div>

      <div style="
      position: absolute;
      background-color: red;
      color: white;
      top: 60px;
      right: 10px;
      z-index: 25;
      ">
        absolute
      </div>

    <div style="
      background-color: lightblue;
      height: 200px;
      width: 200px;">div 1</div>

    <div style="
    background-color: lightpink;
      height: 200px;
      width: 200px;
      position: relative;
      ">
      div 2
        <div style="
        position: absolute;
        background-color: black;
        color: white;
        bottom: 60px;
        right: 10px;
        ">
          5:00
      </div>
    </div>
  </body>
</html>
