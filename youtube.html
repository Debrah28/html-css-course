<!DOCTYPE html>
<html>
  <head>
    <title>YouTube.com Clone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
      p{
        font-family: Roboto, Arial;
        margin-top: 0;
        margin-bottom: 0;
      }
      .thumbnail{
         width: 300px;
         display: block;
      }
      .search-bar{
        display: block;
      }
      .title{
        margin-top: 0;
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        margin-bottom: 12px;
        /* the 500 comes from the sizes we picked on google fonts*/
      }
      
      .preview{
        width: 300px;
        display: inline-block;
        vertical-align: top; 
        margin-right: 15px;
      } /* it is always inline-block not inline;
/*       .text, .text2{
        display: inline-block;
        the search to can be change to a block element
      }*/

      .channel-picture{
        display: inline-block;
        width: 50px;
        vertical-align: top;
      }/*channel-picture and video-info are our horizontal layouts. we set the width of our picture too a 100% so that it takes up the entire space of its container(the div)*/

      .video-info{
        display: inline-block;
        width: 200px;
      }

      .profile-picture{
        width: 40px;
        border-radius: 50px;
      }

      .thumbnail-row{
        margin-bottom: 12px;
      }

      .text2, .text{
        font-size: 12px;
        color: rgb(96, 96, 96);
      }

      .text2{
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <input class="search-bar" type="text" placeholder="Search">

    <div class="preview">

    <div class="thumbnail-row"> <img class="thumbnail" src="thumbnails/thumbnail-1.webp"></div>

    <div>
      <div class="channel-picture">
        <img class="profile-picture" src="channel-pictures/channel-1.jpeg">
      </div>

      <div class="video-info">
        <p class="title">
      Talking Tech and AI with Google CEO Sundar Pichai!
    </p>

    <p class="text2">
      Marques Brownlee  
    </p>

    <p class=" text">
      3.4M views &#183; 6 months ago
    </p>
  </div>
  </div>     
  </div>

  <div class="preview">

    <div class="thumbnail-row"> <img class="thumbnail" src="thumbnails/thumbnail-2.webp"></div>

    <div>
      <div class="channel-picture">
        <img class="profile-picture" src="channel-pictures/channel-2.jpeg">
      </div>

      <div class="video-info">
        <p class="title">
      Try Not To Laugh Challenge #9
    </p>

    <p class="text2">
      Markiplier  
    </p>

    <p class=" text">
      19M views &#183; 4 years ago
    </p>
  </div>
  </div>     
  </div>
    
  </body>
</html>
